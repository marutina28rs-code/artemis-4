<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARTEMIS 4</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; outline: none; background: #000; }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
             color: #f2c14e; font: 20px monospace; background: #05061c; gap: 14px; }
  #bar { width: 320px; height: 14px; border: 3px solid #f2c14e; }
  #fill { height: 100%; width: 0; background: #f2c14e; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
<div id="loading"><div>ARTEMIS 4</div><div id="bar"><div id="fill"></div></div><div id="msg">Cargando...</div></div>
<script>
  var Module = {
    canvas: document.getElementById('canvas'),
    setStatus: function (text) {
      var m = text && text.match(/\((\d+(?:\.\d+)?)\/(\d+)\)/);
      if (m) document.getElementById('fill').style.width = (100 * parseFloat(m[1]) / parseFloat(m[2])) + '%';
      if (!text) document.getElementById('loading').style.display = 'none';
    },
    onRuntimeInitialized: function () { document.getElementById('loading').style.display = 'none'; Module.canvas.focus(); },
    print: function (t) { console.log(t); },
    printErr: function (t) { console.warn(t); }
  };
  window.addEventListener('click', function () { Module.canvas.focus(); });
  window.addEventListener('keydown', function (e) {
    if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].indexOf(e.key) >= 0) e.preventDefault();
  });
</script>
{{{ SCRIPT }}}
</body>
</html>
